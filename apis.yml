aid: opencurriculum
name: Opencurriculum
description: >-
  OpenCurriculum is a nonprofit education-technology organization (a Y Combinator
  alum) that builds curriculum-planning software for K-12 schools. Its web
  application helps teachers and administrators create and organize lesson plans,
  unit plans, and courses; draw on a curated library of high-quality, ready-to-go
  teaching ideas, resources, and strategies; align instruction to standards and
  learning goals; collaborate with colleagues on instructional design; and track
  progress through planner, calendar, and semester views with alignment analytics.
  The organization is based in Sacramento, California. As of this enrichment pass
  OpenCurriculum publishes no public API, developer portal, SDK, OpenAPI
  specification, webhooks, or /.well-known discovery surface; it maintains a small
  public GitHub organization (one public repository, "flow", an open-source
  learning-app maker). This profile therefore carries company identity only, with
  no API artifacts to enrich.
